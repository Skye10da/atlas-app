name: atlas_app
description: "Atlas — AI-native reading platform."
publish_to: 'none'
version: 1.0.7+7

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local database (offline-first)
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Code generation support
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Logging
  logger: ^2.5.0

  # EPUB parsing
  epub_plus: ^5.1.0

  # File picking
  file_picker: ^8.0.0

  # Drag-and-drop file import (desktop)
  desktop_drop: ^0.7.1

  # Networking
  http: ^1.5.0
  cronet_http: ^1.9.0
  cupertino_http: ^3.0.2

  # HTML DOM parsing (content engine)
  html: ^0.15.5

  # ZIP + XML parsing (resilient EPUB import)
  archive: ^4.0.9
  xml: ^6.6.1

  # Hashing (content versioning / plugin verification)
  crypto: ^3.0.6

  # Utilities
  equatable: ^2.0.7
  shared_preferences: ^2.5.5
  image: ^4.8.0
  screen_brightness_pro:
    git:
      url: https://github.com/Skye10da/screen_brightness_pro.git
      ref: "4966010"
  battery_plus: ^7.1.1

  # Skeleton / shimmer loading
  skeletonizer: ^2.1.3
  country_flags: ^4.1.2
  flutter_tts: ^4.2.5
  audio_service: ^0.18.19

  # Indexed chapter navigation (replaces pixel-offset jump estimation)
  scrollable_positioned_list: ^0.3.8

  # PDF rendering/viewer (pdfrx, on top of PDFium)
  pdfrx: ^2.4.7

  # Realistic 3D-like physical page flip engine
  real_page_flip: ^2.2.9

  # Opening external links from PDFs
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.1.5
  pointycastle: 3.9.0

  # UI automation entrypoint (lib/driver_main.dart) — enables the
  # flutter_driver extension for external driving of taps/scrolls/finders.
  flutter_driver:
    sdk: flutter
  workmanager: ^0.10.9
  flutter_local_notifications: ^22.3.0
  permission_handler: ^13.0.1
  rxdart: ^0.28.0
  share_plus: ^12.0.2

# permission_handler_android 14.0.0 is broken (requires compileSdk 37 / AGP 9,
# which no stable toolchain provides — see Baseflow issue #1556).
dependency_overrides:
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # UI automation entrypoint (lib/driver_main.dart) — enables the
  # flutter_driver extension for external driving of taps/scrolls/finders.
  # Linter & Custom Lint
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.4

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  drift_dev: ^2.25.2

  # Mocking
  mocktail: ^1.0.4
  sqlite3: ^2.4.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/data/google_fonts_catalog.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
