name: atlas_app
description: "Atlas — AI-native reading platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local database (offline-first)
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Code generation support
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Logging
  logger: ^2.5.0

  # EPUB parsing
  epub_plus: ^5.1.0

  # File picking
  file_picker: ^8.0.0

  # Google Fonts
  google_fonts: ^6.2.1

  # Networking
  http: ^1.5.0

  # HTML DOM parsing (content engine)
  html: ^0.15.5

  # ZIP + XML parsing (resilient EPUB import)
  archive: ^4.0.9
  xml: ^6.6.1

  # Hashing (content versioning / plugin verification)
  crypto: ^3.0.6

  # Utilities
  equatable: ^2.0.7
  shared_preferences: ^2.5.5
  image: ^4.8.0
  screen_brightness_pro:
    git:
      url: https://github.com/Skye10da/screen_brightness_pro.git
      ref: "4966010"
  battery_plus: ^7.1.1

  # Skeleton / shimmer loading
  skeletonizer: ^2.1.3
  flutter_tts: ^4.2.5
  audio_service: ^0.18.19

  # Indexed chapter navigation (replaces pixel-offset jump estimation)
  scrollable_positioned_list: ^0.3.8

  # PDF rendering/viewer (pdfrx, on top of PDFium)
  pdfrx: ^2.4.7

  # Opening external links from PDFs
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  drift_dev: ^2.25.2

  # Mocking
  mocktail: ^1.0.4
  sqlite3: ^2.4.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
