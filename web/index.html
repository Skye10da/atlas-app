<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    them to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO: Atlas — AI-native reading platform ==========================
       The landing page renders to canvas, so crawlers see the head first.
       Everything marketing-critical lives here (plus the <noscript> block
       at the bottom). Update OG/discourse URLs together with the canonical
       domain when the deployment root changes. -->
  <title>Atlas — the AI-native reading platform</title>
  <meta name="description"
        content="Atlas turns every EPUB, PDF, and web-novel feed into a deeply understood reading experience — AI chapter context, offline-first library, sentence-tracked narration. Free & open source.">
  <link rel="canonical" href="https://atlas-app.dev/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Atlas">
  <meta property="og:title" content="Atlas — the AI-native reading platform">
  <meta property="og:description"
        content="One shelf for books and web serials. AI that knows the story. Free & MIT.">
  <meta property="og:url" content="https://atlas-app.dev/">
  <meta property="og:image"
        content="https://atlas-app.dev/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Atlas — the AI-native reading platform">
  <meta name="twitter:description"
        content="One shelf for books and web serials. AI that knows the story. Free & MIT.">
  <meta name="twitter:image"
        content="https://atlas-app.dev/icons/Icon-512.png">

  <!-- Structured data: SoftwareApplication -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Atlas",
    "applicationCategory": "BookReaderApplication",
    "operatingSystem": "Windows, macOS, Linux, Android, iOS",
    "description": "AI-native, offline-first reading platform for EPUB, PDF and web novels with chapter-context AI, translation pipelines and karaoke narration.",
    "license": "https://opensource.org/licenses/MIT",
    "url": "https://atlas-app.dev/",
    "downloadUrl": "https://github.com/Skye10da/atlas-app/releases/latest",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "author": {
      "@type": "Person",
      "name": "Skye"
    }
  }
  </script>

  <!-- Theme + PWA -->
  <meta name="theme-color" content="#0A0A12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Atlas">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <noscript>
    <!-- Crawler & no-JS fallback: the pitch + the direct download path.
         Kept minimal deliberately; the JSON-LD above carries search intent. -->
    <h1>Atlas — the AI-native reading platform</h1>
    <p>
      One shelf for EPUBs, PDFs, and web novels. AI chapter context that knows
      the story, translation with glossary memory, and karaoke-style
      narration. Offline-first, private, free and open source (MIT).
    </p>
    <p>
      <a href="https://github.com/Skye10da/atlas-app/releases/latest">
        Download the latest release for Windows, macOS, Linux, or Android
      </a>
    </p>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
