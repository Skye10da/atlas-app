name: Build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Android (APK)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # NOTE: this produces a debug-signed release build (no signingConfig).
      # Fine for internal testing; before shipping to Play Store, add a
      # release keystore via secrets and wire it into
      # android/app/build.gradle's signingConfigs.release.
      - run: flutter pub get
      - name: Patch real_page_flip Android build (upstream KTS is broken on Kotlin 2.2.20 / Gradle 8.11)
        run: |
          set -e
          for base in "$PUB_CACHE" "$HOME/.pub-cache" "/home/runner/.pub-cache" "$(flutter pub cache dir 2>/dev/null || true)"; do
            [ -z "$base" ] && continue
            DIR="$base/hosted/pub.dev/real_page_flip-2.2.9/android"
            if [ -d "$DIR" ]; then
              echo "Patching $DIR"
              rm -f "$DIR/build.gradle.kts"
              cat > "$DIR/build.gradle" <<'GRADLE_EOF'
          group 'com.chapdcha.real_page_flip'
          version '1.0-SNAPSHOT'

          buildscript {
              ext.kotlin_version = '2.2.20'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.11.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }

          rootProject.allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          apply plugin: 'com.android.library'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.chapdcha.real_page_flip'
              compileSdk 36

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
                  test.java.srcDirs += 'src/test/kotlin'
              }

              defaultConfig {
                  minSdkVersion 24
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
          }

          dependencies {
              testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
              testImplementation "org.mockito:mockito-core:5.0.0"
          }
          GRADLE_EOF
              echo "Patched build.gradle:"
              cat "$DIR/build.gradle"
              break
            fi
          done
      - run: flutter build apk --release --split-per-abi --split-debug-info=build/app/symbols --obfuscate
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: android-symbols
          path: build/app/symbols
          retention-days: 14

  build-windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Atlas-Windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: Atlas-Windows.zip
          retention-days: 14

  build-linux:
    name: Linux
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update -y
      - run: sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf Atlas-Linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: Atlas-Linux.tar.gz
          retention-days: 14

  build-ios:
    name: iOS (no codesign)
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      # Unsigned .app — useful as a CI build-health check, not installable
      # on a real device. Kept as a short-retention artifact only; deliberately
      # NOT included in the `release` job's asset list below (see note there).
      - uses: actions/upload-artifact@v7
        with:
          name: ios-release-unsigned
          path: build/ios/iphoneos/*.app
          retention-days: 14

  build-macos:
    name: macOS
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - run: zip -r Atlas-macOS.zip build/macos/Build/Products/Release/*.app
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: Atlas-macOS.zip
          retention-days: 14

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-android
      - build-windows
      - build-linux
      - build-ios
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          # ios-release-unsigned is intentionally excluded: an unsigned .app
          # from --no-codesign isn't installable on a real device, so it
          # isn't a useful public release asset. It's still built and
          # uploaded above as a short-lived CI artifact so a broken iOS
          # build still fails the workflow before a release is cut.
          files: |
            artifacts/android-release/**/*.apk
            artifacts/windows-release/**/*.zip
            artifacts/linux-release/**/*.tar.gz
            artifacts/macos-release/**/*.zip
          generate_release_notes: true