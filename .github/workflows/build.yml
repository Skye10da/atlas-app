name: Build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.41.9'
  XCODE_VERSION: '16.2'

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Android (APK + AAB)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # NOTE: this produces a debug-signed release build (no signingConfig).
      # Fine for internal testing; before shipping to Play Store, add a
      # release keystore via secrets and wire it into
      # android/app/build.gradle's signingConfigs.release.
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 14

  build-windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Atlas-Windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: Atlas-Windows.zip
          retention-days: 14

  build-linux:
    name: Linux
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update -y
      - run: sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf Atlas-Linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: Atlas-Linux.tar.gz
          retention-days: 14

  build-ios:
    name: iOS (no codesign)
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      # Unsigned .app — useful as a CI build-health check, not installable
      # on a real device. Kept as a short-retention artifact only; deliberately
      # NOT included in the `release` job's asset list below (see note there).
      - uses: actions/upload-artifact@v7
        with:
          name: ios-release-unsigned
          path: build/ios/iphoneos/*.app
          retention-days: 14

  build-macos:
    name: macOS
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - run: zip -r Atlas-macOS.zip build/macos/Build/Products/Release/*.app
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: Atlas-macOS.zip
          retention-days: 14

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-android
      - build-windows
      - build-linux
      - build-ios
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          # ios-release-unsigned is intentionally excluded: an unsigned .app
          # from --no-codesign isn't installable on a real device, so it
          # isn't a useful public release asset. It's still built and
          # uploaded above as a short-lived CI artifact so a broken iOS
          # build still fails the workflow before a release is cut.
          files: |
            artifacts/android-release/**/*.apk
            artifacts/android-release/**/*.aab
            artifacts/windows-release/**/*.zip
            artifacts/linux-release/**/*.tar.gz
            artifacts/macos-release/**/*.zip
          generate_release_notes: true