name: Release

# Builds signed release artifacts for every platform and publishes them as a
# GitHub Release. GitHub Releases doubles as the app's self-update feed: the
# in-app updater reads the generated `manifest.json` asset from
# `api.github.com/repos/Skye10da/atlas-app/releases/latest`.
#
# Tag format: v<semver>+<build>, e.g. `v1.0.8+8`. Tags containing `-` (e.g.
# `v1.0.8-rc.1+9`) are published as GitHub prereleases and only surface in the
# app when the user opts into the "beta" update channel.
#
# Tag protection rules + a `production` environment (repo settings) gate the
# publish job behind manual approval, so a leaked token alone cannot serve a
# rogue release to the self-updating fleet. All third-party actions are pinned
# to commit SHAs to reduce CI supply-chain risk.
#
# Required repo secrets (see docs/release.md for setup):
#   ANDROID_KEYSTORE_B64   — base64-encoded release .jks keystore
#   ANDROID_STORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything but publish as a draft release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  # ---------------------------------------------------------------------------
  # Android: signed APK (sideload self-update target)
  # ---------------------------------------------------------------------------
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is not set — cannot produce a signed release APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > android/app/atlas-release.jks
          cat > android/key.properties <<EOF
          storeFile=atlas-release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Pub get
        run: flutter pub get

      # Workaround carried from build.yml: real_page_flip-2.2.9 declares
      # desktop plugin platforms with no usable native implementation, which
      # corrupts the Android gradle build; the patch strips them.
      - name: Patch real_page_flip
        run: dart run tool/patch_real_page_flip.dart

      - name: Analyze (zero-warning gate)
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          BUILD_NAME="${VERSION%%+*}"
          # versionCode (the +build suffix) is mandatory — the updater relies on
          # it for comparisons, so a tag without one must fail loudly.
          BUILD_NUMBER="${VERSION##*+}"
          if [ "$BUILD_NUMBER" = "$VERSION" ]; then
            echo "::error::Tag '$TAG' has no '+<versionCode>' suffix (expected v$VERSION+<n>)."
            exit 1
          fi
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.build_name }}
          --build-number=${{ steps.version.outputs.build_number }}

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/atlas-${{ github.ref_name }}-android.apk"

      # Asset naming contract (consumed by the landing page's smart-download
      # resolver + tool/generate_manifest.py):
      #   atlas-<tag>-<platform>[-<arch>].<ext>
      # Windows ships x64 today; the -x64 suffix keeps the resolver able to
      # serve Windows-ARM/x64 ambiguity and any future ARM64 job.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows: zipped portable Release folder (swap-on-restart self-update target)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Workaround carried from build.yml: real_page_flip-2.2.9 declares a
      # Windows plugin platform with no package-shipped CMake implementation,
      # which breaks generated_plugins.cmake add_subdirectory during build.
      - name: Patch real_page_flip
        run: dart run tool/patch_real_page_flip.dart

      - name: Build
        run: flutter build windows --release

      - name: Zip Release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/atlas-${{ github.ref_name }}-windows-x64.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-zip
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: single GitHub Release holding every artifact + manifest.json
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows]
    if: always() && needs.build-android.result == 'success' && needs.build-windows.result == 'success'
    # `production` is configured in repo settings with "required reviewers"
    # (= repo owner) and "selected tags" policy `v*` — a rogue token or actor
    # cannot publish without a human clicking Approve.
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history + tags so tool/build_release_notes.py can fall back to
          # the commit messages between the previous tag and this one.
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/

      - name: Flatten artifact folders
        run: |
          mv dist/android-apk/* dist/
          mv dist/windows-zip/* dist/
          rmdir dist/android-apk dist/windows-zip
          ls -la dist/

      - name: Generate manifest.json (update feed)
        id: manifest
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tool/generate_manifest.py "${TAG#v}" dist manifest.json

      # GitHub's --generate-notes only yields PR titles plus a
      # "Full Changelog: .../compare/..." link. Release bodies must be the
      # real changelog (CHANGELOG.md, falling back to commit messages).
      - name: Build release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tool/build_release_notes.py "$TAG" CHANGELOG.md release-notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          FLAGS=""
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists — delete the tag or rename it."
            exit 1
          fi
          if grep -q -- '-' <<<"${TAG#v}"; then FLAGS="$FLAGS --prerelease"; fi
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --draft"; fi
          gh release create "$TAG" --notes-file release-notes.md $FLAGS dist/*
